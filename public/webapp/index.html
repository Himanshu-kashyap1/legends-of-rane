<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Legends of Rane — 3D Monster Hunting World</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Three.js & OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 3D WebGL Canvas Container -->
  <div id="canvas-container"></div>

  <!-- Dynamic Floating Combat Numbers & Drop FX Layer -->
  <div id="combat-hud-overlay"></div>

  <!-- Interactive Overlay UI -->
  <div class="ui-layer">
    <!-- Top Status & Action Bar -->
    <div class="top-bar glass-panel interactive">
      <!-- Player Vital Stats -->
      <div class="player-hud">
        <div class="avatar-badge" id="player-level-badge">Lv 1</div>
        <div class="vitals">
          <div class="vital-row">
            <span class="player-name" id="player-name-display">Hunter</span>
            <span class="player-coins" id="player-coins-display">🪙 0</span>
          </div>
          <div class="hp-bar-track">
            <div class="hp-bar-fill" id="player-hp-bar" style="width: 100%;"></div>
            <span class="hp-text" id="player-hp-text">100 / 100 HP</span>
          </div>
        </div>
      </div>

      <!-- Current Location & Mode Toggle -->
      <div class="top-center-status">
        <div class="biome-pill" id="current-biome-pill">🏰 Holy Sanctuary</div>
      </div>

      <div class="top-actions">
        <button class="btn-icon mode-toggle-btn" id="btn-toggle-game-mode" title="Toggle Mode">⚔️ Hunt</button>
        <button class="btn-icon" id="btn-open-forge" title="Equipment & Forge">🗡️ Gear</button>
        <button class="btn-icon" id="btn-tod" title="Toggle Lighting">☀️ Day</button>
      </div>
    </div>

    <!-- Mode Selector (Building Mode Only) -->
    <div class="mode-bar interactive" id="building-mode-bar" style="display: none;">
      <button class="btn-mode active" id="btn-mode-place">🔨 Place Block</button>
      <button class="btn-mode" id="btn-mode-break">⛏️ Break Block</button>
    </div>

    <!-- Toast Notifications -->
    <div id="toast-container">
      <div class="toast" id="toast-msg">Welcome to the Monster Hunting World!</div>
    </div>

    <!-- Mobile Virtual Joystick (Left) -->
    <div class="joystick-zone interactive" id="joystick-zone">
      <div class="joystick-base" id="joystick-base">
        <div class="joystick-knob" id="joystick-knob"></div>
      </div>
    </div>

    <!-- Mobile Action Combat Controls (Right) -->
    <div class="combat-actions-zone interactive" id="combat-actions-zone">
      <button class="btn-action btn-target" id="btn-action-target" title="Target Lock">🎯</button>
      <button class="btn-action btn-sprint" id="btn-action-sprint" title="Sprint">🏃</button>
      <button class="btn-action btn-attack primary" id="btn-action-attack" title="Attack">⚔️</button>
    </div>

    <!-- Bottom Hotbar & Full Palette (Building Mode) -->
    <div class="bottom-section" id="building-bottom-section" style="display: none;">
      <div class="hotbar-container glass-panel interactive" id="hotbar-container">
        <!-- 9 Slots dynamically injected by app.js -->
      </div>
      <button class="btn-palette-toggle interactive" id="btn-palette-open">📦 All Blocks (28+)</button>
    </div>
  </div>

  <!-- Telegram Inventory & Weapon Forge Drawer -->
  <div class="modal-overlay" id="forge-modal">
    <div class="modal-card glass-panel interactive" style="max-width: 480px;">
      <div class="modal-header">
        <h3>🗡️ Equipment & Telegram Forge</h3>
        <button class="btn-icon" id="btn-forge-close">✕</button>
      </div>
      <div class="modal-body" id="forge-body">
        <!-- Injected dynamically -->
      </div>
    </div>
  </div>

  <!-- Full Categorized Block Palette Modal -->
  <div class="modal-overlay" id="palette-modal">
    <div class="modal-card glass-panel interactive">
      <div class="modal-header">
        <h3>📦 Block Palette Catalog</h3>
        <button class="btn-icon" id="btn-palette-close">✕</button>
      </div>
      <div class="modal-body" id="palette-body">
        <!-- Categories and items dynamically populated -->
      </div>
    </div>
  </div>

  <!-- Clear Base Confirmation Modal -->
  <div class="modal-overlay" id="clear-modal">
    <div class="modal-card glass-panel interactive" style="max-width: 360px;">
      <div class="modal-header">
        <h3 style="color: #ef4444;">⚠️ Clear Entire Base?</h3>
        <button class="btn-icon" id="btn-clear-close">✕</button>
      </div>
      <div class="modal-body" style="text-align: center;">
        <p style="color: #cbd5e1; font-size: 0.9rem; line-height: 1.4;">
          Are you sure you want to remove all placed blocks? This action cannot be undone.
        </p>
        <div style="display: flex; gap: 10px; margin-top: 14px; justify-content: center;">
          <button class="btn-icon" id="btn-clear-cancel" style="padding: 8px 16px;">Cancel</button>
          <button class="btn-icon" id="btn-clear-confirm" style="background: #ef4444; border-color: #ef4444; color: white; padding: 8px 16px;">Confirm Clear</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
