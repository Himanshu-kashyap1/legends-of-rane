<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Legends of Rane — 3D Voxel Base</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Three.js & OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 3D WebGL Canvas Container -->
  <div id="canvas-container"></div>

  <!-- Interactive Overlay UI -->
  <div class="ui-layer">
    <!-- Top Status & Action Bar -->
    <div class="top-bar glass-panel interactive">
      <div class="base-title">
        <span>🏰</span>
        <span id="base-name-display">My Sanctuary</span>
        <span class="block-counter" id="block-counter">0 / 2000</span>
      </div>

      <div class="top-actions">
        <button class="btn-icon" id="btn-tod" title="Toggle Lighting">☀️ Day</button>
        <button class="btn-icon" id="btn-recenter" title="Recenter Camera">🎯 Center</button>
        <button class="btn-icon" id="btn-clear-open" title="Clear Base" style="color: #f87171;">🗑️ Clear</button>
      </div>
    </div>

    <!-- Mode Selector (Place vs Break) -->
    <div class="mode-bar interactive">
      <button class="btn-mode active" id="btn-mode-place">🔨 Place Block</button>
      <button class="btn-mode" id="btn-mode-break">⛏️ Break Block</button>
    </div>

    <!-- Toast Notifications -->
    <div id="toast-container">
      <div class="toast" id="toast-msg">Base saved to cloud!</div>
    </div>

    <!-- Bottom Hotbar & Full Palette Trigger -->
    <div class="bottom-section">
      <div class="hotbar-container glass-panel interactive" id="hotbar-container">
        <!-- 9 Slots dynamically injected by app.js -->
      </div>
      <button class="btn-palette-toggle interactive" id="btn-palette-open">📦 All Blocks (28+)</button>
    </div>
  </div>

  <!-- Full Categorized Block Palette Modal -->
  <div class="modal-overlay" id="palette-modal">
    <div class="modal-card glass-panel interactive">
      <div class="modal-header">
        <h3>📦 Block Palette Catalog</h3>
        <button class="btn-icon" id="btn-palette-close">✕</button>
      </div>
      <div class="modal-body" id="palette-body">
        <!-- Categories and items dynamically populated -->
      </div>
    </div>
  </div>

  <!-- Clear Base Confirmation Modal -->
  <div class="modal-overlay" id="clear-modal">
    <div class="modal-card glass-panel interactive" style="max-width: 360px;">
      <div class="modal-header">
        <h3 style="color: #ef4444;">⚠️ Clear Entire Base?</h3>
        <button class="btn-icon" id="btn-clear-close">✕</button>
      </div>
      <div class="modal-body" style="text-align: center;">
        <p style="color: #cbd5e1; font-size: 0.9rem; line-height: 1.4;">
          Are you sure you want to remove all placed blocks? This action cannot be undone.
        </p>
        <div style="display: flex; gap: 10px; margin-top: 14px; justify-content: center;">
          <button class="btn-icon" id="btn-clear-cancel" style="padding: 8px 16px;">Cancel</button>
          <button class="btn-icon" id="btn-clear-confirm" style="background: #ef4444; border-color: #ef4444; color: white; padding: 8px 16px;">Confirm Clear</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
